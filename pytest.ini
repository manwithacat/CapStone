[pytest]
# Pytest configuration for Jupyter notebook testing with nbmake

# Test discovery
testpaths = jupyter_notebooks
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Notebook testing with nbmake
addopts =
    -v
    --nbmake
    --nbmake-timeout=600
    --tb=short
    --strict-markers
    -n auto
    --dist=loadfile

# Exclude directories
norecursedirs =
    .ipynb_checkpoints
    .git
    __pycache__
    data
    outputs
    models
    tmp
    build
    dist
    .venv
    .pytest_cache
    node_modules

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    data_download: marks tests that download large datasets
    requires_gpu: marks tests that require GPU
    integration: marks integration tests
    unit: marks unit tests

# Timeout settings
timeout = 600
timeout_method = thread

# Output options
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Coverage (optional)
# addopts = --cov=src --cov-report=html --cov-report=term-missing
