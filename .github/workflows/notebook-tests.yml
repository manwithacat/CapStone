name: Notebook Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'jupyter_notebooks/**'
      - 'src/**'
      - 'requirements.txt'
      - 'setup.py'
      - 'pytest.ini'
      - '.github/workflows/notebook-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'jupyter_notebooks/**'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false  # Continue testing other versions even if one fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'  # Cache pip dependencies

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhdf5-dev \
            libopencv-dev \
            python3-opencv

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Verify installations
        run: |
          python --version
          pip list
          pytest --version

      - name: Prepare notebooks for testing
        run: python scripts/prepare_notebooks_for_testing.py

      - name: Run fast notebook tests
        run: |
          pytest \
            -m "not slow and not data_download" \
            --nbmake-timeout=300 \
            --tb=short \
            -v
        env:
          PYTHONHASHSEED: "42"
          CI: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            jupyter_notebooks/.pytest_cache/
          retention-days: 7

      - name: Comment on PR (if failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Notebook tests failed for Python ${{ matrix.python-version }}. Please check the logs.'
            })

  test-notebooks-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libopencv-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Prepare notebooks
        run: python scripts/prepare_notebooks_for_testing.py

      - name: Run slow notebook tests (excluding data downloads)
        run: |
          pytest \
            -m "slow and not data_download" \
            --nbmake-timeout=600 \
            --tb=short \
            -v
        env:
          PYTHONHASHSEED: "42"
          CI: "true"

      - name: Upload slow test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-slow-results
          path: .pytest_cache/
          retention-days: 7
